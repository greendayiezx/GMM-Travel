<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 64 64"
     fill="none">

  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45C6FF"/>
      <stop offset="100%" stop-color="#1565D8"/>
    </linearGradient>

    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FF62"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0"
                    dy="2"
                    stdDeviation="2"
                    flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- Message Bubble -->
    <path
      d="M14 16
         C14 12.7 16.7 10 20 10
         H44
         C47.3 10 50 12.7 50 16
         V34
         C50 37.3 47.3 40 44 40
         H28
         L20 48
         V40
         H20
         C16.7 40 14 37.3 14 34
         Z"
      fill="url(#blue)"/>

    <!-- SMS Text -->
    <text
      x="32"
      y="29"
      text-anchor="middle"
      font-size="10"
      font-family="Arial, Helvetica, sans-serif"
      font-weight="700"
      fill="url(#lime)">
      SMS
    </text>

    <!-- Notification Dot -->
    <circle
      cx="47"
      cy="15"
      r="3.5"
      fill="url(#lime)"/>

  </g>

</svg>
