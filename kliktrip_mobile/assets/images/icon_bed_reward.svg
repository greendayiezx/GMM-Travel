<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bedBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2EA8FF"/>
      <stop offset="100%" stop-color="#1565D8"/>
    </linearGradient>
    <linearGradient id="limeAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8FF3F"/>
      <stop offset="100%" stop-color="#B8F000"/>
    </linearGradient>
  </defs>

  <!-- Headboard -->
  <rect x="6" y="18" width="6" height="30" rx="2" fill="url(#bedBlue)"/>

  <!-- Mattress -->
  <rect x="12" y="24" width="44" height="18" rx="5" fill="url(#bedBlue)"/>

  <!-- Pillow -->
  <rect x="15" y="27" width="12" height="8" rx="3" fill="url(#limeAccent)"/>

  <!-- Blanket Accent -->
  <rect x="27" y="24" width="29" height="18" rx="5" fill="#FFFFFF" opacity="0.12"/>

  <!-- Bed Frame -->
  <rect x="6" y="42" width="52" height="5" rx="2.5" fill="#0E5BD6"/>

  <!-- Legs -->
  <rect x="8" y="47" width="3" height="8" rx="1.5" fill="#0E5BD6"/>
  <rect x="53" y="47" width="3" height="8" rx="1.5" fill="#0E5BD6"/>

  <!-- Lime Accent Line -->
  <rect x="12" y="40" width="44" height="2" rx="1" fill="url(#limeAccent)"/>
</svg>
