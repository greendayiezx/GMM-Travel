<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 64 64"
     fill="none">

  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42C4FF"/>
      <stop offset="100%" stop-color="#1565D8"/>
    </linearGradient>

    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FF62"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0"
                    dy="2"
                    stdDeviation="2"
                    flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- Shield -->
    <path
      d="M32 8
         L48 14
         V28
         C48 40
         40.5 49
         32 54
         C23.5 49
         16 40
         16 28
         V14
         Z"
      fill="url(#blue)"/>

    <!-- Inner Circle -->
    <circle
      cx="32"
      cy="29"
      r="9"
      fill="url(#lime)"/>

    <!-- Check -->
    <path
      d="M28 29.5
         L31 32.5
         L36.5 27"
      stroke="#1565D8"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Small Spark -->
    <circle
      cx="45"
      cy="17"
      r="2"
      fill="url(#lime)"
      opacity=".9"/>

  </g>

</svg>
