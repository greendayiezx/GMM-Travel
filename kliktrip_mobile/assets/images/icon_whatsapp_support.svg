<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 64 64"
     fill="none">

  <defs>

    <linearGradient id="blue"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#42C7FF"/>
      <stop offset="100%" stop-color="#1565D8"/>
    </linearGradient>

    <linearGradient id="lime"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#F5FF6A"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0"
                    dy="2"
                    stdDeviation="2"
                    flood-opacity=".18"/>
    </filter>

  </defs>

  <g filter="url(#shadow)">

    <!-- Chat Bubble -->
    <path
      d="M32 10
         C20.4 10 11 18.7 11 29.5
         C11 35.4 13.8 40.6 18.2 44.2
         L16.3 52
         L24.1 48.8
         C26.5 49.6 29.2 50 32 50
         C43.6 50 53 41.3 53 30.5
         C53 18.7 43.6 10 32 10Z"
      fill="url(#blue)"/>

    <!-- Phone -->
    <path
      d="M37.8 35.8
         C36.7 36.8 35.5 37.1 34.2 36.7
         C28.6 34.9 24.1 30.5 22.3 24.8
         C21.9 23.5 22.2 22.3 23.2 21.2
         L24.6 19.8
         C25.3 19.1 26.4 19.1 27.1 19.8
         L29.7 22.4
         C30.4 23.1 30.4 24.2 29.7 24.9
         L28.6 26
         C29.7 28.2 31.8 30.3 34 31.4
         L35.1 30.3
         C35.8 29.6 36.9 29.6 37.6 30.3
         L40.2 32.9
         C40.9 33.6 40.9 34.7 40.2 35.4
         Z"
      fill="url(#lime)"/>

    <!-- Notification -->
    <circle
      cx="47"
      cy="17"
      r="3.5"
      fill="url(#lime)"/>

  </g>

</svg>
