name: kliktrip_mobile
description: "Global Explore Tour & Travel (Umroh & Travel) Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  equatable: ^2.0.5

  # Networking & Serialization
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # Local Storage & Utilities
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

  # Security
  flutter_windowmanager: ^0.2.0
  clerk_auth: ^0.0.18-beta
  path_provider: ^2.1.6
  flutter_web_auth_2: ^5.0.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/wisata.json
    - assets/images/
