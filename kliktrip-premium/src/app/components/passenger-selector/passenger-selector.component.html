<div class="passenger-selector-wrapper relative">
  <!-- Trigger button -->
  <div class="space-y-1">
    <div class="flex items-center justify-between h-4">
      <label class="text-xs font-semibold uppercase tracking-wider" style="color:rgba(44,62,80,0.60)">Penumpang</label>
    </div>
    <button #triggerButton (click)="toggle()"
      (keydown.escape)="close()"
      [attr.aria-expanded]="isOpen"
      aria-haspopup="dialog"
      aria-label="Pilih jumlah penumpang"
      class="w-full flex items-center gap-3 border rounded-xl px-4 py-3 text-left transition-all duration-200"
      [style.border-color]="isOpen ? '#1E9BF0' : '#e5e7eb'"
      [style.box-shadow]="isOpen ? '0 0 0 3px rgba(30,155,240,0.12)' : 'none'">
      <svg class="w-5 h-5 flex-shrink-0" style="color:#1E9BF0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="flex-1 text-sm" style="color:#1A1A1A">{{ label }}</span>
      <svg class="w-4 h-4 transition-transform duration-200 flex-shrink-0" style="color:#9ca3af"
        [style.transform]="isOpen ? 'rotate(180deg)' : 'rotate(0)'"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
  </div>

  <!-- Dropdown -->
  <div #dropdownPortal
    class="bg-white rounded-2xl p-4"
    [style.display]="isOpen ? 'block' : 'none'"
    style="position: fixed !important; z-index: 9999999 !important; background-color: #ffffff !important; opacity: 1 !important; box-shadow: 0 20px 60px rgba(0,0,0,0.22) !important; border: 1px solid #e2e8f0 !important;"
    [style.top.px]="dropdownTop"
    [style.left.px]="dropdownLeft"
    [style.width.px]="dropdownWidth">
    <div class="space-y-4">
      <div *ngFor="let type of types" class="flex items-center justify-between">
        <div>
          <p class="text-sm font-semibold" style="color:#1A1A1A">{{ type.label }}</p>
          <p class="text-xs" style="color:rgba(44,62,80,0.55)">{{ type.sublabel }}</p>
        </div>
        <div class="flex items-center gap-3">
          <button (click)="decrease(type)"
            [attr.aria-label]="'Kurangi ' + type.label"
            [disabled]="type.count <= type.min"
            class="w-8 h-8 rounded-full border flex items-center justify-center transition-all duration-150"
            [style.border-color]="type.count > type.min ? '#1E9BF0' : '#e5e7eb'"
            [style.color]="type.count > type.min ? '#1E9BF0' : '#d1d5db'"
            [style.opacity]="type.count <= type.min ? '0.5' : '1'">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>
            </svg>
          </button>
          <span class="w-6 text-center text-sm font-bold" style="color:#1A1A1A">{{ type.count }}</span>
          <button (click)="increase(type)"
            [attr.aria-label]="'Tambah ' + type.label"
            [disabled]="type.count >= type.max"
            class="w-8 h-8 rounded-full border flex items-center justify-center transition-all duration-150"
            [style.border-color]="type.count < type.max ? '#1E9BF0' : '#e5e7eb'"
            [style.color]="type.count < type.max ? '#1E9BF0' : '#d1d5db'"
            [style.opacity]="type.count >= type.max ? '0.5' : '1'">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Total & confirm -->
    <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">
      <p class="text-sm" style="color:rgba(44,62,80,0.60)">Total: <span class="font-bold" style="color:#1A1A1A">{{ total }} penumpang</span></p>
      <button (click)="close()"
        class="text-sm font-semibold text-white px-4 py-2 rounded-lg transition-colors"
        style="background:#1E9BF0">
        Selesai
      </button>
    </div>
  </div>
</div>
