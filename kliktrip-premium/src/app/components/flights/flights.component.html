<div class="w-full min-h-screen bg-slate-900/10 backdrop-blur-[2px] pt-12 text-white relative z-20">

  <!-- Back to home — triggers the dive-down transition -->
  <button (click)="goBack()" class="absolute top-6 left-6 z-50 flex items-center gap-2
           bg-white/90 hover:bg-white text-slate-800 font-bold
           py-2.5 px-5 rounded-full shadow-lg text-sm
           transition-colors duration-200">
    ← Kembali
  </button>

  <h1 class="text-center text-5xl font-black tracking-tight text-white drop-shadow-md mb-2">
    Jadwal Keberangkatan Terbaik Anda
  </h1>
  <p class="text-center text-slate-100 font-medium drop-shadow-sm text-lg mb-10">
    Silakan pilih tiket dan kelas perjalanan sesuai preferensi Anda
  </p>

  <div class="flex flex-col gap-6 max-w-4xl mx-auto px-6 pb-16 relative z-30">

    @for (ticket of displayTickets; track ticket.flightNumber) {
    <app-flight-card
      [airline]="{ name: 'GMM Travel', logo: '', flightNumber: ticket.flightNumber }"
      [departureTime]="ticket.departureTime"
      [arrivalTime]="ticket.arrivalTime"
      [duration]="getTravelDuration()"
      [departureCity]="origin"
      [arrivalCity]="destination"
      [routeDescription]="getRouteDescription()"
      [stops]="0"
      [price]="ticket.price"
      currency="IDR"
      [refundableType]="ticket.type"
      [offer]="ticket.type === 'EXECUTIVE' ? 'Layanan Premium' : 'Harga Terbaik'"
      (book)="onBookTicket(ticket)"
      class="w-full">
    </app-flight-card>
    } @empty {
    <div class="text-center col-span-3 text-slate-400 py-12">
      Tidak ada jadwal keberangkatan yang tersedia.
    </div>
    }

  </div>

  <app-footer-section *ngIf="displayTickets && displayTickets.length > 0"
                      class="relative z-30 block mt-12 w-full"
                      style="align-self: stretch;"></app-footer-section>
</div>
