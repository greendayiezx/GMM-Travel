<div class="usp-card group relative rounded-2xl p-6 space-y-4 border transition-all duration-300 hover:-translate-y-1 cursor-default overflow-hidden"
  [style.border-color]="borderColor"
  style="background:#FFFFFF">

  <!-- Background glow on hover -->
  <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none rounded-2xl"
    [style.background]="'radial-gradient(circle at 50% 0%, ' + accentBg + ', transparent 70%)'"></div>

  <!-- Icon -->
  <div class="relative w-14 h-14 rounded-2xl flex items-center justify-center transition-transform duration-300 group-hover:scale-110"
    [style.background]="accentBg">

    <!-- Shield -->
    <svg *ngIf="icon === 'shield'" class="w-7 h-7" [style.color]="accentColor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
    </svg>
    <!-- Headset -->
    <svg *ngIf="icon === 'headset'" class="w-7 h-7" [style.color]="accentColor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
    <!-- Lightning -->
    <svg *ngIf="icon === 'lightning'" class="w-7 h-7" [style.color]="accentColor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
    </svg>
    <!-- Star -->
    <svg *ngIf="icon === 'star'" class="w-7 h-7" [style.color]="accentColor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
    </svg>
  </div>

  <!-- Content -->
  <div class="relative space-y-2">
    <h3 class="font-bold text-base" style="color:#1A1A1A">{{ title }}</h3>
    <p class="text-sm leading-relaxed" style="color:rgba(44,62,80,0.65)">{{ description }}</p>

    <!-- Bullet points (if provided) -->
    <ul *ngIf="bulletPoints.length > 0" class="space-y-1.5 mt-3">
      <li *ngFor="let point of bulletPoints" class="flex items-start gap-2 text-sm" style="color:rgba(44,62,80,0.70)">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5" [style.color]="bulletCheckColor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
        {{ point }}
      </li>
    </ul>
  </div>

  <!-- Bottom accent bar -->
  <div class="relative h-0.5 w-0 group-hover:w-full transition-all duration-500 rounded-full" [style.background]="accentColor"></div>
</div>
