<button
  (click)="onClick($event)"
  [disabled]="isLoading"
  [attr.aria-busy]="isLoading"
  aria-label="Cari perjalanan"
  class="relative w-full overflow-hidden text-white font-semibold py-4 rounded-xl flex items-center justify-center gap-3 transition-all duration-200 select-none"
  [style.background]="'#1E9BF0'"
  [style.box-shadow]="'0 8px 25px rgba(30,155,240,0.35)'"
  [style.transform]="isLoading ? 'scale(0.99)' : 'scale(1)'"
  [style.opacity]="isLoading ? '0.9' : '1'">

  <!-- Ripple effects -->
  <span
    *ngFor="let r of ripples"
    class="absolute rounded-full pointer-events-none"
    style="background: rgba(255,255,255,0.35); animation: ripple-expand 0.6s ease-out forwards; transform: translate(-50%,-50%);"
    [style.left.px]="r.x"
    [style.top.px]="r.y"
    [style.width.px]="10"
    [style.height.px]="10">
  </span>

  <!-- Icon: search or spinner -->
  <ng-container *ngIf="!isLoading">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <span>Cari Perjalanan</span>
  </ng-container>

  <ng-container *ngIf="isLoading">
    <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <span>Mencari...</span>
  </ng-container>
</button>
