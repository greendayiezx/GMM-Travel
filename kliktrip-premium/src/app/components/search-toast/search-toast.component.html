<div *ngIf="visible"
  class="fixed bottom-6 right-6 z-50 max-w-sm w-full rounded-2xl p-4 flex items-start gap-3 shadow-2xl"
  [style.background]="type === 'success' ? '#FFFFFF' : '#FFFFFF'"
  style="border: 1px solid #f0f0f0; animation: slide-up 0.3s ease-out">

  <!-- Icon -->
  <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
    [style.background]="type === 'success' ? 'rgba(170,238,0,0.15)' : 'rgba(239,68,68,0.10)'">
    <svg *ngIf="type === 'success'" class="w-5 h-5" style="color:#5cb85c" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
    </svg>
    <svg *ngIf="type === 'error'" class="w-5 h-5" style="color:#ef4444" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01M10.293 4.293a1 1 0 011.414 0l7 7a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7a1 1 0 010-1.414l7-7z"/>
    </svg>
  </div>

  <!-- Content -->
  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold mb-0.5" style="color:#1A1A1A">
      {{ type === 'success' ? 'Sedang mencari...' : 'Lengkapi formulir' }}
    </p>
    <p *ngFor="let msg of messages" class="text-xs" style="color:rgba(44,62,80,0.65)">{{ msg }}</p>
  </div>
</div>
