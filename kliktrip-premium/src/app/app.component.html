<!-- ── Fixed background layers (z-0, behind everything) ─────────────── -->
<!-- Beach starts fully hidden (it sits behind #bg-jalan and was ghosting through
     at the edges). ScrollTrigger fades it in as the Hero scrolls to Destinations. -->
<div [style.display]="hasActiveRoute ? 'none' : 'block'" id="bg-pantai" class="fixed top-0 left-0 w-full h-full z-0 bg-cover bg-center pointer-events-none opacity-0"
  style="background-image: url('assets/pantai.png'); background-color: #1E9BF0;"></div>

<!-- Opacity is controlled 100% by GSAP in onSearchAnimation() — no Angular bindings -->
<div [style.display]="hasActiveRoute ? 'none' : 'block'" id="bg-jalan" class="fixed top-0 left-0 w-full h-full z-0 bg-cover bg-center pointer-events-none"
  style="background-image: url('assets/jalan.png'); background-color: #1E9BF0;"></div>

<div [style.display]="hasActiveRoute ? 'none' : 'block'" id="bg-langit" class="fixed top-0 left-0 w-full h-full z-0 bg-cover bg-center pointer-events-none opacity-0"
  style="background-image: url('assets/awan-kartun.png'); background-color: #1E9BF0;"></div>

<!-- ── Three.js canvas (z-10, above backgrounds, below UI) ─────────── -->
<canvas [style.display]="hasActiveRoute ? 'none' : 'block'" #webglCanvas class="webgl-canvas"></canvas>

<!-- ── Loading screen for the return trip ────────────────────────── -->
<div *ngIf="isReturning"
     class="fixed inset-0 z-[60] flex flex-col items-center justify-center gap-5
            bg-slate-900/40 backdrop-blur-sm pointer-events-none">
  <app-loader-one></app-loader-one>
  <p class="text-white font-semibold text-sm tracking-wide drop-shadow-md">
    Kembali ke beranda…
  </p>
</div>

<!-- ── Main UI layer (z-20) ────────────────────────────────────────── -->
<div id="content-layer" class="relative z-20 w-full min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- ── Navbar (hidden on login/register/checkout/payment pages) ── -->
  <nav class="main-nav" *ngIf="!hideMainNav">
    
    <!-- Top Bar -->
    <div class="nav-top-bar">
      <div class="ntb-right">
        <div class="ntb-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a8eb12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 11 11 13 15 9"/>
          </svg>
          <span>Aman & Terpercaya</span>
        </div>
        <span class="ntb-divider">|</span>
        <div class="ntb-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0055ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
          <span>Layanan 24/7</span>
        </div>
        <span class="ntb-divider">|</span>
        <div class="ntb-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffd600" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <circle cx="7" cy="7" r=".5"/>
          </svg>
          <span>Harga Terbaik</span>
        </div>
      </div>
    </div>

    <!-- Colored Separator Strip -->
    <div class="nav-color-strip">
      <div class="ncs-blue"></div>
      <div class="ncs-green"></div>
      <div class="ncs-yellow"></div>
    </div>

    <!-- Main White Navbar Row -->
    <div class="nav-container">

      <!-- Logo (flush left) -->
      <a href="/" class="nav-logo-link">
        <img src="assets/gmm-tour-logo.png" alt="GMM Travel Logo" class="nav-logo-img">
        <div class="nav-logo-text-wrap">
          <span class="nav-logo-title">GMM Global <span class="nav-logo-gradient">Explore</span></span>
          <span class="nav-logo-sub">Your Trusted Travel Partner</span>
        </div>
      </a>

      <!-- Hamburger toggle button (visible on mobile) -->
      <button class="nav-mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <svg *ngIf="!isMobileMenuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg *ngIf="isMobileMenuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- Nav Menu Links (centered) -->
      <div class="nav-menu" [class.mobile-open]="isMobileMenuOpen">
        <a href="/" class="nav-menu-item" [class.active]="!hasActiveRoute">Beranda</a>
        <a href="#" class="nav-menu-item">Travel</a>
        <a href="#destinations-section" (click)="scrollToDestinations($event)" class="nav-menu-item">Tour</a>
        <a href="#" class="nav-menu-item">Promo</a>
        <a href="#" class="nav-menu-item">Tentang Kami</a>
        <a href="#" class="nav-menu-item">Kontak</a>
      </div>

      <!-- Search Input Bar -->
      <div class="nav-search-wrap">
        <input #navSearch type="text" [placeholder]="searchPlaceholder"
               class="nav-search-input"
               (keydown.enter)="navSearch.value && onNavSearch(navSearch.value)">
        <span class="nav-search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </span>
      </div>

      <!-- Auth Actions (flush right) -->
      <div class="nav-actions" [class.mobile-open]="isMobileMenuOpen">

        <!-- Belum login -->
        <ng-container *ngIf="!clerk.isSignedIn()">
          <a routerLink="/login" class="btn-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Login
          </a>
          <a routerLink="/register" class="btn-register">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="17" y1="11" x2="23" y2="11"/>
            </svg>
            Daftar
          </a>
        </ng-container>

        <!-- Sudah login -->
        <ng-container *ngIf="clerk.isSignedIn()">
          <div class="nav-profile-wrap">
            <button class="nav-avatar-btn" (click)="showUserMenu = !showUserMenu">
              <ng-container *ngIf="clerk.user()?.imageUrl; else initialsBlock">
                <img [src]="clerk.user()!.imageUrl" [alt]="clerk.user()!.initials" class="nav-avatar-img"/>
              </ng-container>
              <ng-template #initialsBlock>
                <span class="nav-avatar-initials">{{ clerk.user()?.initials }}</span>
              </ng-template>
            </button>

            <!-- Dropdown -->
            <div class="nav-profile-dropdown" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
              <!-- Header card (Luxury Dark Navy + Mosque Silhouette) -->
              <div class="npd-header-card">
                <!-- Background decorative elements -->
                <div class="npd-card-bg-ring-1"></div>
                <div class="npd-card-bg-ring-2"></div>
                <div class="npd-card-bg-mosque"></div>

                <div class="npd-card-content">
                  <div class="npd-card-top-row">
                    <h3 class="npd-card-user-name">
                      {{ clerk.user()?.fullName ?? clerk.user()?.firstName ?? 'Faras Perdana Subianto Putra' }}
                    </h3>
                    <button class="npd-card-edit-btn" (click)="clerk.openUserProfile(); showUserMenu=false" title="Edit Profil">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                      </svg>
                    </button>
                  </div>

                  <div class="npd-card-badges-wrap">
                    <div class="npd-badge-row">
                      <div class="npd-badge-icon lime">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                      </div>
                      <span class="npd-badge-text">Tier Silver</span>
                    </div>

                    <div class="npd-badge-row">
                      <div class="npd-badge-icon blue-outlined">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                      </div>
                      <span class="npd-badge-text">0</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="npd-divider"></div>

              <!-- Menu items -->
              <button class="npd-item" (click)="showUserMenu=false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                Wishlist
              </button>
              <button class="npd-item" (click)="showUserMenu=false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>
                Pesanan Saya
              </button>
              <button class="npd-item" (click)="showUserMenu=false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
                Riwayat Perjalanan
              </button>
              <button class="npd-item" (click)="showUserMenu=false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg>
                Metode Pembayaran
              </button>
              <button class="npd-item" (click)="clerk.openUserProfile(); showUserMenu=false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>
                Pengaturan Akun
              </button>

              <div class="npd-divider"></div>

              <button class="npd-item npd-logout" (click)="clerk.signOut(); showUserMenu=false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Keluar
              </button>
            </div>
          </div>
        </ng-container>

      </div>

    </div>
  </nav>

  <!-- ── Main Content Area ────────────────────────────────────────── -->
  <main class="flex-1 w-full" [style.paddingTop]="hideMainNav ? '0' : '115px'">

    <!-- ══ PHASE 1: Hero + site sections (rendered ONLY on home path) ══ -->
    <div *ngIf="!showTicketResults && !hasActiveRoute" class="w-full">
      <section class="min-h-screen flex items-center justify-center bg-transparent">
        <app-hero-section (searchConfirmed)="onSearchAnimation()" class="w-full"></app-hero-section>
      </section>

      <section id="destinations-section" class="bg-transparent">
        <app-destinations-section class="w-full"
          (selectDestination)="onSelectDestination($event)"></app-destinations-section>
      </section>

      <section class="min-h-screen flex items-center justify-center bg-transparent">
        <app-usp-section class="w-full"></app-usp-section>
      </section>
    </div>

    <!-- ══ Router outlet: booking, flights & destination pages ══ -->
    <div [style.display]="hasActiveRoute || showTicketResults ? 'block' : 'none'"
         [style.background]="showTicketResults && !hasActiveRoute ? 'transparent' : '#FAFAFA'"
         class="w-full relative z-30 min-h-[60vh]">
      <router-outlet (activate)="onRouteActivate()" (deactivate)="onRouteDeactivate()"></router-outlet>
    </div>

  </main>

  <!-- ── Footer (renders on ALL paths/routes) ───────────────────── -->
  <app-footer-section *ngIf="!hideMainNav" class="w-full relative z-30 mt-auto"></app-footer-section>

</div>

<!-- ── Route loading screen ────────────────────────────────────────── -->
<div class="route-loader" [class.visible]="isNavigating">
  <div class="route-loader__card">
    <app-infinity-loader [size]="64" color="#1e9bf0"></app-infinity-loader>
    <p class="route-loader__text">Memuat halaman…</p>
  </div>
</div>

<!-- ── Cloud wipe transition ("Lihat Paket") ──────────────────────── -->
<div #fadeTransisi id="transisi-fade"></div>

<!-- ── Auth Modal (Login / Daftar) ───────────────────────────────── -->
<app-auth-modal [mode]="authMode" (closed)="authMode=null"></app-auth-modal>
